name: GTA6 Top Moments 24/7 Autopilot

on:
  schedule:
    # UTC times = TRT (Europe/Istanbul, UTC+3) minus 3h. Must match config.json "schedule".
    # Owner's plan (2026-11-20): Video A + Video B every day, 3 X text posts, a long video every 3 days
    # (the cron fires daily; config.json "every_days" makes the bot skip the in-between days).
    - cron: '10 12 * * *'   # 15:10 TRT  long_video     (every 3 days, published automatically after QA)
    - cron: '50 13 * * *'   # 16:50 TRT  x_text_morning (question / poll, 08:50 New York)
    - cron: '40 16 * * *'   # 19:40 TRT  vertical_clip  Video A: rotation (11:40 New York)
    - cron: '10 19 * * *'   # 22:10 TRT  x_question_nostalgia (hot take / poll)
    - cron: '40 22 * * *'   # 01:40 TRT  video_b        Video B: normal rotation (17:40 New York)
    - cron: '20 1 * * *'    # 04:20 TRT  x_daily_recap
  workflow_dispatch:
    inputs:
      slot:
        description: 'What to run (check_setup = test all your secrets, posts nothing)'
        type: choice
        default: check_setup
        options:
          - check_setup
          - voice_samples
          - remake
          - stream_clip
          - long_video
          - approve_long
          - vertical_clip
          - video_b
          - money_clip
          - trends
          - x_video_clip
          - test_all
          - x_text_morning
          - x_question_nostalgia
          - x_daily_recap
      dry_run:
        description: 'Dry run: find + render the video but do NOT post (download it from the run Artifacts)'
        type: boolean
        default: true
      remake_clip:
        description: 'For slot = remake: clip id to re-make with a new script + voice (empty = last published video)'
        type: string
        default: ''
      providers:
        description: 'Test runs only: limit footage sources, e.g. x_accounts (empty = all)'
        type: string
        default: ''
      format:
        description: 'Manual runs only. Shorts: a format. Long video: moments / money_guide / trend_guide'
        type: choice
        default: auto
        options:
          - auto
          - top5_funny
          - car_chases
          - top5_things_to_do
          - secrets
          - stunts_crashes
          - stream_reactions
          - trending
          - money_tips
          - money_guide
          - moments
          - trend_guide

concurrency:
  # real runs share one queue (state is saved between them); dry runs never save state, so each gets its own
  # queue - test runs no longer block or cancel the real schedule
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && format('gta6-dry-{0}', github.run_id) || 'gta6-autopilot' }}
  cancel-in-progress: false

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore state (posted history + used sources)
        uses: actions/cache/restore@v4
        with:
          path: queue
          key: gta6-queue-${{ github.run_id }}
          restore-keys: |
            gta6-queue-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Month (for refreshing the package cache)
        id: month
        run: echo "value=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      # The Ubuntu mirror is sometimes extremely slow, and ffmpeg needs ~60 packages.
      # Keep the downloaded .deb files in the Actions cache so later runs install offline in seconds.
      - name: Restore cached ffmpeg packages
        id: aptcache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.month.outputs.value }}
          restore-keys: |
            apt-debs-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install FFmpeg + fonts (apt)
        timeout-minutes: 6
        continue-on-error: true
        run: |
          # Ubuntu's background auto-updater grabs the package lock on fresh runners -> stop it first
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo killall -q unattended-upgr 2>/dev/null || true
          mkdir -p ~/apt-debs/partial
          OPTS="-o Dir::Cache::Archives=$HOME/apt-debs -o APT::Keep-Downloaded-Packages=true -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          PKGS="ffmpeg fonts-montserrat fontconfig"
          # fast path: runner's package lists + cached .debs (no downloads); otherwise refresh lists and download
          sudo apt-get install -y -q --no-install-recommends $OPTS $PKGS \
            || { sudo apt-get update -q $OPTS && sudo apt-get install -y -q --no-install-recommends $OPTS $PKGS; }
          sudo chmod -R a+rX ~/apt-debs

      - name: Retry FFmpeg install (only if the first attempt stalled)
        timeout-minutes: 10
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          echo "First apt attempt failed/stalled - repairing and retrying"
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo killall -q -9 apt-get apt dpkg unattended-upgr 2>/dev/null || true
          sleep 3
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
          sudo dpkg --configure -a || true
          mkdir -p ~/apt-debs/partial
          OPTS="-o Dir::Cache::Archives=$HOME/apt-debs -o APT::Keep-Downloaded-Packages=true -o DPkg::Lock::Timeout=120 -o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          sudo apt-get update -q $OPTS
          sudo apt-get install -y -q --no-install-recommends $OPTS ffmpeg fontconfig
          sudo chmod -R a+rX ~/apt-debs
          ffmpeg -version | head -1

      - name: Save ffmpeg packages for next runs
        if: steps.aptcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-debs-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.month.outputs.value }}

      - name: Install Python dependencies
        run: pip install -U -r requirements.txt

      - name: Install browser for free X posting (only if X_COOKIES is set)
        timeout-minutes: 6
        continue-on-error: true
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          if [ -z "$X_COOKIES" ]; then echo "X_COOKIES not set - skipping"; exit 0; fi
          pip install -q playwright
          # Google Chrome is preinstalled on GitHub runners; only fetch Chromium if it is missing
          command -v google-chrome >/dev/null || python -m playwright install chromium

      - name: Cache Whisper speech-to-text model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: Run autopilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_PROFILE: ${{ secrets.UPLOAD_POST_PROFILE }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TIMEZONE: Europe/Istanbul
          SCHEDULE_CRON: ${{ github.event.schedule }}
          SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORMAT: ${{ github.event_name == 'workflow_dispatch' && inputs.format || 'auto' }}
          REMAKE_CLIP: ${{ github.event_name == 'workflow_dispatch' && inputs.remake_clip || '' }}
          SOURCE_PROVIDERS: ${{ github.event_name == 'workflow_dispatch' && inputs.providers || '' }}
        run: python autopilot.py

      - name: Upload rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name == 'workflow_dispatch' && inputs.slot == 'voice_samples') && 'voice-samples' || 'video' }}-${{ github.run_id }}
          path: |
            work/ready/*.mp4
            work/ready/*.png
            work/ready/*.jpg
            work/ready/*.txt
            work/ready/*.mp3
          retention-days: 5
          if-no-files-found: ignore

      - name: Save state
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: actions/cache/save@v4
        with:
          path: queue
          key: gta6-queue-${{ github.run_id }}-${{ github.run_attempt }}
