[pytest]
# Offline test suite: python -m pytest   (skip the FFmpeg end-to-end renders locally with: -m "not slow")
testpaths = tests
pythonpath = . tests
addopts = -ra --strict-markers --import-mode=importlib --durations=12
markers =
    slow: end-to-end FFmpeg renders (tens of seconds each) - CI always runs them
# a hung FFmpeg / network call must not stall CI (pytest-timeout, see requirements-dev.txt)
timeout = 600
log_level = INFO
filterwarnings =
    ignore::DeprecationWarning
